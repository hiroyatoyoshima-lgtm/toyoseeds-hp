<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>ToyoSeeds OGP Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background:
        linear-gradient(90deg, rgba(30,39,97,.78) 0%, rgba(30,39,97,.68) 40%, rgba(30,39,97,.48) 58%, rgba(30,39,97,.10) 82%, rgba(30,39,97,.02) 100%),
        url("./assets/stay.webp") center / cover no-repeat;
      color: #fff;
      font-family: "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .content { position: absolute; inset: 0; width: 690px; padding: 72px 0 62px 76px; display: flex; flex-direction: column; }
    .logo { font: 800 38px/1 Arial, sans-serif; letter-spacing: -.04em; }
    .logo span { color: #59bd61; }
    .line { width: 76px; height: 8px; margin-top: 26px; border-radius: 999px; background: #59bd61; }
    h1 { margin: 60px 0 0; font-size: 58px; font-weight: 800; line-height: 1.42; letter-spacing: .02em; white-space: nowrap; }
    p { margin: auto 0 0; font-size: 23px; font-weight: 600; line-height: 1.8; letter-spacing: .04em; color: rgba(255,255,255,.84); }
  </style>
</head>
<body>
  <main class="content">
    <div class="logo">Toyo<span>Seeds</span></div>
    <div class="line"></div>
    <h1>AI・データで、<br>ビジネスを加速する。</h1>
    <p>宿を営み、店を営み、<br>その現場をテクノロジーで回す。</p>
  </main>
</body>
</html>
