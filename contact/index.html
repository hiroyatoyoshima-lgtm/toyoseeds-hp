<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜ToyoSeeds合同会社</title>
<meta name="description" content="ToyoSeeds合同会社へのお問い合わせはこちらから。">
<link rel="canonical" href="https://www.toyoseeds.com/contact/">
<meta property="og:type" content="website">
<meta property="og:title" content="お問い合わせ｜ToyoSeeds合同会社">
<meta property="og:description" content="事業やプロジェクトについて、お気軽にご相談ください。">
<meta property="og:url" content="https://www.toyoseeds.com/contact/">
<meta property="og:image" content="https://www.toyoseeds.com/assets/og-image-v3.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../assets/content-v2.css">
<script src="../assets/contact.js" defer></script>
</head>
<body>
<header class="content-header">
  <a class="brand" href="/">Toyo<span>Seeds</span></a>
  <nav aria-label="主要メニュー">
    <a href="/">ホーム</a><a href="/news/">News</a><a href="/#company">会社概要</a><a class="nav-contact" href="/contact/" aria-current="page">お問い合わせ</a>
  </nav>
</header>
<main class="standard-shell">
  <p class="eyebrow">CONTACT</p>
  <h1>お問い合わせ</h1>
  <p class="lead">事業やプロジェクトについて、下記フォームよりお気軽にご連絡ください。内容を確認のうえ、担当者からご返信します。</p>
  <div class="standard-card">
    <form id="contact-form" class="contact-form" novalidate>
      <div class="field">
        <label for="name">お名前 <span class="required">必須</span></label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
      </div>
      <div class="field">
        <label for="company">会社名・団体名 <span class="form-note">任意</span></label>
        <input id="company" name="company" type="text" autocomplete="organization" maxlength="120">
      </div>
      <div class="field">
        <label for="email">メールアドレス <span class="required">必須</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" inputmode="email" required>
      </div>
      <div class="field">
        <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
        <textarea id="message" name="message" maxlength="5000" required></textarea>
      </div>
      <div class="honeypot" aria-hidden="true">
        <label for="website">ウェブサイト</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input id="started-at" name="startedAt" type="hidden">
      <label class="check-row">
        <input id="privacy" name="privacy" type="checkbox" required>
        <span><a href="/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します。 <span class="required">必須</span></span>
      </label>
      <p class="form-note">????????????????????????????????????</p>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      <button id="submit-button" class="button submit-button" type="submit">送信する</button>
    </form>
  </div>
</main>
<footer class="content-footer">
  <a class="brand brand--footer" href="/">Toyo<span>Seeds</span></a>
  <div><a href="/privacy-policy/">プライバシーポリシー</a><span>© ToyoSeeds LLC.</span></div>
</footer>
</body>
</html>
